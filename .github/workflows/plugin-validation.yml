name: Plugin validation

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    name: Validate Scribe plugin package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate plugin manifests and draw rotation
        run: python3 tools/validate_plugin.py
